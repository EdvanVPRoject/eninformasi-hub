<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Solid Neon Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#10B981" flood-opacity="0.4" result="color"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box: Dark Obsidian -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#0B0F19" stroke="#10B981" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Concept 1: Isometric Hexagonal 'EN' Portal (Solid Emerald Green) -->
  <g filter="url(#emeraldGlow)">
    <!-- Outer Hexagonal Facets & 'E' Structure -->
    <!-- Top-Left & Spine of 'E' -->
    <path d="M60 22 L32 38 V82 L60 98" stroke="#10B981" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle Prong of 'E' -->
    <path d="M32 60 L54 48" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'N' Structure & Diagonal Hex Cross -->
    <!-- Right Spine of 'N' -->
    <path d="M88 38 V82" stroke="#10B981" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Diagonal Connection creating 'N' and isometric depth -->
    <path d="M52 38 L88 64" stroke="#10B981" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top Right & Bottom Return of Hexagon -->
    <path d="M60 22 L88 38" stroke="#10B981" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M60 98 L88 82" stroke="#10B981" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Center Isometric Nexus Node -->
    <circle cx="60" cy="60" r="4" fill="#00F59B" />
  </g>
</svg>
