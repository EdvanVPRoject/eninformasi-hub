<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="url(#accGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Top Header Bar -->
  <g transform="translate(80, 80)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="110" y="24" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      HARDWARE-SETUP
    </text>

    <!-- Site Branding -->
    <text x="1040" y="25" fill="#a1a1aa" font-family="monospace, monospace" font-size="14" font-weight="600" text-anchor="end" letter-spacing="1">
      INFORMASI HUB // EDITORIAL
    </text>
  </g>

  <!-- Main Article Title -->
  <g transform="translate(0, 200)">
    <text x="80" y="40" fill="#fafafa" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      <tspan x="80" dy="0">Tutorial Open WebUI: Bikin Tampilan</tspan><tspan x="80" dy="54">ala ChatGPT Pribadi di Server Rumah</tspan><tspan x="80" dy="54">(Self-Hosted)</tspan>
    </text>
  </g>

  <!-- Bottom Info Footer -->
  <g transform="translate(80, 510)">
    <!-- Accent Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Author Attribution -->
    <circle cx="16" cy="38" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="16" y="43" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">E</text>
    <text x="42" y="43" fill="#e4e4e7" font-family="monospace, monospace" font-size="15" font-weight="600">
      Oleh: EdvanVPRoject
    </text>

    <!-- Tags -->
    <text x="1040" y="43" fill="#71717a" font-family="monospace, monospace" font-size="14" text-anchor="end">
      #Open WebUI   #Docker   #Ollama
    </text>
  </g>
</svg>